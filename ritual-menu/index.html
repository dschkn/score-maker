<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ea" id="themeColor">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="statusStyle">
  <meta name="apple-mobile-web-app-title" content="Today">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <title>Today</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5ef;
      --surface: #fffefa;
      --surface-soft: #f0ede5;
      --text: #111111;
      --muted: #8c8981;
      --line: rgba(17, 17, 17, .11);
      --shadow: 0 18px 60px rgba(20, 18, 13, .08);
      --modal-backdrop: rgba(25, 23, 18, .22);
      --radius: 24px;
      font-family: "Avenir Next", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #080808;
      --surface: #111111;
      --surface-soft: #191919;
      --text: #f5f3ee;
      --muted: #8b8b87;
      --line: rgba(255, 255, 255, .12);
      --shadow: 0 20px 70px rgba(0, 0, 0, .44);
      --modal-backdrop: rgba(0, 0, 0, .64);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    body {
      min-height: 100svh;
      transition: background .24s ease, color .24s ease;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { border: 0; background: none; padding: 0; }
    .app {
      width: min(100%, 640px);
      min-height: 100svh;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 98px);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 46px;
    }
    .wordmark {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .top-actions { display: flex; gap: 10px; }
    .circle-button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      background: var(--surface);
      box-shadow: 0 4px 18px rgba(20, 18, 13, .04);
    }
    .plus { font-size: 27px; font-weight: 300; line-height: 1; padding-bottom: 2px; }
    .theme-mark {
      width: 17px;
      height: 17px;
      border: 1.3px solid var(--text);
      border-radius: 50%;
      background: linear-gradient(90deg, var(--text) 50%, transparent 50%);
      transform: rotate(-18deg);
    }
    .screen { display: none; animation: appear .25s ease both; }
    .screen.active { display: block; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: none; }
    }
    .hero { padding: 36px 2px 34px; }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .02em;
      text-transform: capitalize;
    }
    h1 {
      margin: 0;
      max-width: 440px;
      font-size: clamp(36px, 11vw, 56px);
      line-height: .98;
      letter-spacing: -.052em;
      font-weight: 500;
    }
    .subline { margin: 16px 0 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 4px 2px 14px;
    }
    .section-head h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: .09em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .count { color: var(--muted); font-size: 13px; }
    .task-list { display: grid; gap: 12px; }
    .task-card {
      width: 100%;
      min-height: 92px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 15px;
      padding: 18px 18px 18px 17px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: left;
      transition: transform .16s ease, opacity .16s ease, background .24s ease;
    }
    .task-card:active { transform: scale(.985); }
    .task-check {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 1.3px solid var(--text);
      position: relative;
      opacity: .8;
    }
    .task-card.done { opacity: .44; }
    .task-card.done .task-check::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: var(--text);
    }
    .task-card.done .task-title { text-decoration: line-through; text-decoration-thickness: 1px; }
    .task-content { min-width: 0; text-align: left; }
    .task-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .02em;
    }
    .task-time { color: var(--text); font-weight: 600; }
    .priority {
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 4px 7px 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .priority.high { color: var(--text); border-color: var(--text); }
    .task-title {
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 17px;
      line-height: 1.26;
      font-weight: 450;
    }
    .task-delete {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 20px;
      border-radius: 50%;
    }
    .empty {
      padding: 54px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }
    .empty strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 18px;
      font-weight: 500;
    }
    .all-header { padding: 38px 2px 28px; }
    .all-header h1 { font-size: clamp(38px, 12vw, 58px); }
    .all-groups { display: grid; gap: 34px; }
    .date-group { display: grid; gap: 12px; }
    .date-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 2px;
    }
    .date-label strong { font-size: 15px; font-weight: 600; }
    .date-label span { color: var(--muted); font-size: 12px; }
    .bottom-nav {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 14px);
      width: min(calc(100% - 32px), 608px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      box-shadow: 0 14px 44px rgba(20, 18, 13, .10);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .nav-button {
      min-height: 47px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }
    .nav-button.active { color: var(--text); background: var(--surface-soft); }
    dialog {
      border: 0;
      padding: 0;
      margin: auto;
      width: min(calc(100% - 32px), 520px);
      max-height: calc(100svh - 44px);
      color: var(--text);
      background: transparent;
      overflow: visible;
    }
    dialog::backdrop {
      background: var(--modal-backdrop);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }
    dialog[open] { animation: modal-in .24s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes modal-in {
      from { opacity: 0; transform: translateY(10px) scale(.97); }
      to { opacity: 1; transform: none; }
    }
    .modal-card {
      max-height: calc(100svh - 44px);
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 24px;
      background: var(--surface-soft);
      box-shadow: 0 34px 100px rgba(0,0,0,.28);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
    }
    .modal-head h2 { margin: 0; font-size: 25px; letter-spacing: -.035em; font-weight: 500; }
    .close-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      font-size: 22px;
      color: var(--muted);
      background: var(--surface);
    }
    .field { display: grid; gap: 9px; margin-bottom: 20px; }
    .field > span, .priority-field > span {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .11em;
      text-transform: uppercase;
      font-weight: 600;
    }
    textarea, input[type="date"], input[type="time"] {
      width: 100%;
      border: 1px solid var(--line);
      outline: none;
      border-radius: 18px;
      background: var(--surface);
      color: var(--text);
    }
    textarea { min-height: 112px; resize: none; padding: 16px; font-size: 18px; line-height: 1.35; }
    .date-time { display: grid; grid-template-columns: 1.25fr .75fr; gap: 10px; }
    input[type="date"], input[type="time"] { min-height: 54px; padding: 0 14px; font-size: 16px; }
    .priority-field { display: grid; gap: 10px; margin-bottom: 25px; }
    .priority-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
    }
    .priority-option { min-height: 44px; border-radius: 13px; color: var(--muted); font-size: 13px; }
    .priority-option.active {
      color: var(--text);
      background: var(--surface-soft);
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .save-button {
      width: 100%;
      min-height: 56px;
      border-radius: 18px;
      background: var(--text);
      color: var(--bg);
      font-size: 15px;
      font-weight: 600;
    }
    .toast {
      position: fixed;
      z-index: 40;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 92px);
      transform: translate(-50%, 16px);
      padding: 11px 16px;
      border-radius: 999px;
      color: var(--bg);
      background: var(--text);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 380px) {
      .app { padding-left: 16px; padding-right: 16px; }
      .hero { padding-top: 28px; }
      .task-card { padding-left: 15px; padding-right: 14px; }
      .modal-card { padding: 20px; }
      .date-time { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="wordmark">Today</div>
      <div class="top-actions">
        <button class="circle-button" id="themeButton" aria-label="Сменить тему"><span class="theme-mark" aria-hidden="true"></span></button>
        <button class="circle-button plus" id="addButton" aria-label="Добавить задачу">+</button>
      </div>
    </header>

    <section class="screen active" id="todayScreen">
      <div class="hero">
        <p class="eyebrow" id="todayDate"></p>
        <h1 id="greeting">Доброе утро.<br>Вот задачи на сегодня.</h1>
        <p class="subline" id="todaySummary"></p>
      </div>
      <div class="section-head">
        <h2>Сегодня</h2>
        <span class="count" id="todayCount"></span>
      </div>
      <div class="task-list" id="todayList"></div>
    </section>

    <section class="screen" id="allScreen">
      <div class="all-header">
        <p class="eyebrow">Полный список</p>
        <h1>Все задачи.</h1>
        <p class="subline" id="allSummary"></p>
      </div>
      <div class="all-groups" id="allGroups"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Основная навигация">
    <button class="nav-button active" data-screen="today">Сегодня</button>
    <button class="nav-button" data-screen="all">Все задачи</button>
  </nav>

  <dialog id="taskDialog">
    <form class="modal-card" id="taskForm">
      <div class="modal-head">
        <h2>Новая задача</h2>
        <button type="button" class="close-button" id="closeDialog" aria-label="Закрыть">×</button>
      </div>
      <label class="field">
        <span>Текст</span>
        <textarea id="taskText" maxlength="180" placeholder="Что нужно сделать?" required></textarea>
      </label>
      <div class="date-time">
        <label class="field">
          <span>Дата</span>
          <input type="date" id="taskDate" required>
        </label>
        <label class="field">
          <span>Время</span>
          <input type="time" id="taskTime" required>
        </label>
      </div>
      <div class="priority-field">
        <span>Приоритет</span>
        <div class="priority-picker" id="priorityPicker">
          <button type="button" class="priority-option" data-priority="low">Низкий</button>
          <button type="button" class="priority-option active" data-priority="medium">Средний</button>
          <button type="button" class="priority-option" data-priority="high">Высокий</button>
        </div>
      </div>
      <button class="save-button" id="saveTask" type="submit">Добавить задачу</button>
    </form>
  </dialog>

  <div class="toast" id="toast">Задача добавлена</div>

  <script>
    const STORAGE_KEY = "today.tasks.v2";
    const THEME_KEY = "today.theme.v1";
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const todayScreen = $("#todayScreen");
    const allScreen = $("#allScreen");
    const todayList = $("#todayList");
    const allGroups = $("#allGroups");
    const dialog = $("#taskDialog");
    const form = $("#taskForm");
    const taskText = $("#taskText");
    const taskDate = $("#taskDate");
    const taskTime = $("#taskTime");
    const priorityPicker = $("#priorityPicker");
    const toast = $("#toast");
    let selectedPriority = "medium";

    function localDateKey(date = new Date()) {
      const offset = date.getTimezoneOffset();
      return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 10);
    }

    function nextRoundedTime() {
      const date = new Date(Date.now() + 30 * 60000);
      date.setMinutes(date.getMinutes() < 30 ? 30 : 0, 0, 0);
      if (date.getMinutes() === 0) date.setHours(date.getHours() + 1);
      return date.toTimeString().slice(0, 5);
    }

    function createId() {
      return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
    }

    function starterTasks() {
      const today = localDateKey();
      return [
        { id: createId(), text: "20 минут Java", date: today, time: "09:30", priority: "high", done: false, createdAt: Date.now() },
        { id: createId(), text: "Прогулка без телефона", date: today, time: "14:00", priority: "medium", done: false, createdAt: Date.now() + 1 },
        { id: createId(), text: "Записать одну идею", date: today, time: "19:30", priority: "low", done: false, createdAt: Date.now() + 2 }
      ];
    }

    function loadTasks() {
      try {
        const value = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(value)) return value;
      } catch (error) {
        console.warn("Не удалось прочитать задачи", error);
      }
      const initial = starterTasks();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
      return initial;
    }

    let tasks = loadTasks();
    function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

    function priorityLabel(priority) {
      return { low: "низкий", medium: "средний", high: "высокий" }[priority] || "средний";
    }

    function greetingText() {
      const hour = new Date().getHours();
      if (hour < 12) return "Доброе утро.";
      if (hour < 18) return "Добрый день.";
      return "Добрый вечер.";
    }

    function formatLongDate(dateKey) {
      const date = new Date(`${dateKey}T12:00:00`);
      return new Intl.DateTimeFormat("ru-RU", { weekday: "long", day: "numeric", month: "long" }).format(date);
    }

    function formatShortDate(dateKey) {
      const date = new Date(`${dateKey}T12:00:00`);
      const today = localDateKey();
      const tomorrowDate = new Date();
      tomorrowDate.setDate(tomorrowDate.getDate() + 1);
      const tomorrow = localDateKey(tomorrowDate);
      if (dateKey === today) return "Сегодня";
      if (dateKey === tomorrow) return "Завтра";
      return new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long" }).format(date);
    }

    function sortTasks(items) {
      const weight = { high: 0, medium: 1, low: 2 };
      return [...items].sort((a, b) =>
        a.date.localeCompare(b.date) ||
        a.time.localeCompare(b.time) ||
        weight[a.priority] - weight[b.priority] ||
        a.createdAt - b.createdAt
      );
    }

    function taskCard(task) {
      const article = document.createElement("article");
      article.className = `task-card${task.done ? " done" : ""}`;
      article.dataset.id = task.id;
      article.innerHTML = `
        <button class="task-check" type="button" aria-label="${task.done ? "Вернуть задачу" : "Выполнить задачу"}"></button>
        <button class="task-content" type="button" aria-label="Отметить задачу">
          <div class="task-meta">
            <span class="task-time">${task.time}</span>
            <span class="priority ${task.priority}">${priorityLabel(task.priority)}</span>
          </div>
          <div class="task-title"></div>
        </button>
        <button class="task-delete" type="button" aria-label="Удалить задачу">×</button>`;
      $(".task-title", article).textContent = task.text;
      const toggle = () => {
        task.done = !task.done;
        persist();
        render();
      };
      $(".task-check", article).addEventListener("click", toggle);
      $(".task-content", article).addEventListener("click", toggle);
      $(".task-delete", article).addEventListener("click", () => {
        tasks = tasks.filter(item => item.id !== task.id);
        persist();
        render();
      });
      return article;
    }

    function emptyState(title, copy) {
      const node = document.createElement("div");
      node.className = "empty";
      node.innerHTML = "<strong></strong><span></span>";
      $("strong", node).textContent = title;
      $("span", node).textContent = copy;
      return node;
    }

    function renderToday() {
      const today = localDateKey();
      const todayTasks = sortTasks(tasks.filter(task => task.date === today));
      $("#todayDate").textContent = formatLongDate(today);
      $("#greeting").innerHTML = `${greetingText()}<br>Вот задачи на сегодня.`;
      const remaining = todayTasks.filter(task => !task.done).length;
      $("#todayCount").textContent = `${todayTasks.length}`;
      $("#todaySummary").textContent = todayTasks.length
        ? remaining
          ? `Осталось ${remaining} ${remaining === 1 ? "задача" : remaining < 5 ? "задачи" : "задач"}. Без драмы, просто по одной.`
          : "На сегодня всё. Редкая победа над энтропией."
        : "Сегодня пока пусто.";
      todayList.innerHTML = "";
      if (!todayTasks.length) {
        todayList.append(emptyState("Ничего не запланировано.", "Нажми плюс и добавь первую задачу."));
        return;
      }
      todayTasks.forEach(task => todayList.append(taskCard(task)));
    }

    function renderAll() {
      const ordered = sortTasks(tasks);
      const unfinished = ordered.filter(task => !task.done).length;
      $("#allSummary").textContent = `${tasks.length} всего · ${unfinished} не выполнено`;
      allGroups.innerHTML = "";
      if (!ordered.length) {
        allGroups.append(emptyState("Список пуст.", "Никакой продуктивности. Абсолютная свобода."));
        return;
      }
      const groups = ordered.reduce((map, task) => {
        if (!map.has(task.date)) map.set(task.date, []);
        map.get(task.date).push(task);
        return map;
      }, new Map());
      groups.forEach((groupTasks, date) => {
        const section = document.createElement("section");
        section.className = "date-group";
        section.innerHTML = `
          <div class="date-label"><strong></strong><span>${groupTasks.length}</span></div>
          <div class="task-list"></div>`;
        $("strong", section).textContent = formatShortDate(date);
        const list = $(".task-list", section);
        groupTasks.forEach(task => list.append(taskCard(task)));
        allGroups.append(section);
      });
    }

    function render() { renderToday(); renderAll(); }

    function openDialog() {
      selectedPriority = "medium";
      taskText.value = "";
      taskDate.value = localDateKey();
      taskTime.value = nextRoundedTime();
      $$(".priority-option", priorityPicker).forEach(button => {
        button.classList.toggle("active", button.dataset.priority === selectedPriority);
      });
      dialog.showModal();
      setTimeout(() => taskText.focus(), 160);
    }

    function closeDialog() { dialog.close(); }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    $("#addButton").addEventListener("click", openDialog);
    $("#closeDialog").addEventListener("click", closeDialog);
    dialog.addEventListener("click", event => { if (event.target === dialog) closeDialog(); });
    priorityPicker.addEventListener("click", event => {
      const option = event.target.closest("[data-priority]");
      if (!option) return;
      selectedPriority = option.dataset.priority;
      $$(".priority-option", priorityPicker).forEach(button => button.classList.toggle("active", button === option));
    });
    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = taskText.value.trim();
      if (!text || !taskDate.value || !taskTime.value) return;
      tasks.push({
        id: createId(),
        text,
        date: taskDate.value,
        time: taskTime.value,
        priority: selectedPriority,
        done: false,
        createdAt: Date.now()
      });
      persist();
      closeDialog();
      render();
      showToast("Задача добавлена");
    });
    $$(".nav-button").forEach(button => {
      button.addEventListener("click", () => {
        const screen = button.dataset.screen;
        todayScreen.classList.toggle("active", screen === "today");
        allScreen.classList.toggle("active", screen === "all");
        $$(".nav-button").forEach(item => item.classList.toggle("active", item === button));
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const dark = theme === "dark";
      $("#themeColor").setAttribute("content", dark ? "#080808" : "#f7f5ef");
      $("#statusStyle").setAttribute("content", dark ? "black-translucent" : "default");
      localStorage.setItem(THEME_KEY, theme);
    }
    const savedTheme = localStorage.getItem(THEME_KEY);
    const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    applyTheme(savedTheme || preferredTheme);
    $("#themeButton").addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });

    render();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
</body>
</html>
