<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f0ec"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Ritual"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Ritual Menu</title><style>:root{--p:#f1f0ec;--i:#171717;--m:#77746f;--l:rgba(20,20,20,.13);--c:rgba(255,255,255,.38);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:#171717;background:#f1f0ec}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -10%,#fff,transparent 34rem),var(--p);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit;color:inherit}button{border:0;background:none;padding:0}.app{width:min(100%,620px);min-height:100svh;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 85px)}header,.title,.bar,.sheetHead{display:flex;align-items:center;justify-content:space-between}.icon{min-width:44px;min-height:44px;display:grid;place-items:center}.back{display:flex;align-items:center;font-size:15px}.back b{font-size:31px;font-weight:250;line-height:0;margin-right:5px}.dots{font-weight:800;letter-spacing:3px}.title{padding:18px 2px 24px}.date{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}h1{margin:0;font-size:clamp(32px,9vw,43px);line-height:.96;letter-spacing:-.055em}.ring{--a:0deg;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--i) var(--a),rgba(0,0,0,.09) 0);position:relative;font-size:11px}.ring:after{content:"";position:absolute;inset:4px;background:var(--p);border-radius:50%}.ring span{z-index:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}.card{min-height:170px;padding:15px 14px 12px;border:.75px solid var(--l);border-radius:17px;background:var(--c);display:flex;flex-direction:column}.cardHead{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:baseline;text-align:left;width:100%}.cardHead strong{font-size:17px}.count,.chev{color:var(--m)}.chev{font-size:21px;font-weight:250}.list{list-style:none;padding:0;margin:16px 0 10px;display:grid;gap:9px}.row{display:grid;grid-template-columns:15px minmax(0,1fr) 18px;gap:7px;align-items:start}.check{width:15px;height:18px;display:grid;place-items:center}.check:after{content:"";width:7px;height:7px;border-radius:50%;border:1px solid #999}.text{text-align:left;font-size:13.5px;line-height:1.25}.del{font-size:17px;color:var(--m);opacity:.5}.done .check:after{background:var(--i);box-shadow:inset 0 0 0 2px var(--p);border-color:var(--i)}.done .text{text-decoration:line-through;color:#999}.addSmall{margin-top:auto;text-align:left;color:var(--m);font-size:12px}.bar{position:fixed;left:0;right:0;bottom:0;width:min(100%,620px);margin:auto;padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);height:calc(env(safe-area-inset-bottom) + 66px);background:rgba(241,240,236,.84);backdrop-filter:blur(22px);border-top:.5px solid var(--l);font-size:26px}.overlay{position:fixed;inset:0;background:var(--p);z-index:20;transform:translateY(-102%);transition:.3s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top) + 10px) 22px calc(env(safe-area-inset-bottom) + 20px)}.overlay.open{transform:none}.menuTop{display:flex;justify-content:space-between;align-items:center;font-family:Georgia,serif}.brand{font-size:17px}.menuGrid{display:grid;grid-template-columns:90px 1fr;gap:30px;margin-top:45px;font-family:Georgia,serif}.menuGrid u,.menuLinks button,.extra button{font-size:21px;line-height:1.05;text-align:left}.menuLinks,.extra{display:flex;flex-direction:column;align-items:flex-start}.extra{margin-top:38px;font-family:Georgia,serif}.foot{position:absolute;left:22px;right:22px;bottom:calc(env(safe-area-inset-bottom) + 22px);font:12px Georgia,serif}.footLine{height:.7px;background:#555;margin:8px 0 14px}.sheet{border:0;padding:0;margin:auto 0 0;width:100%;max-width:none;background:transparent}.sheet::backdrop{background:rgba(0,0,0,.25);backdrop-filter:blur(4px)}.form{width:min(100%,620px);margin:auto;background:var(--p);border-radius:24px 24px 0 0;padding:8px 22px calc(env(safe-area-inset-bottom) + 30px);min-height:45svh}.handle{width:38px;height:4px;border-radius:9px;background:#bbb;margin:auto}.sheetHead{height:52px;border-bottom:.5px solid var(--l)}.sheetHead span{font:18px Georgia,serif}.field{display:grid;gap:8px;margin-top:26px}.field span{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.05em}.field input,.field select{border:0;border-bottom:.75px solid #777;background:transparent;border-radius:0;padding:11px 0;font-size:18px;outline:0;width:100%}@media(max-width:370px){.app{padding-left:13px;padding-right:13px}.grid{gap:9px}.card{padding:13px 11px}.cardHead strong{font-size:15px}.text{font-size:12.5px}}</style></head><body><div class="app"><header><button class="back" id="menu"><b>‹</b>Menu</button><button class="icon dots" id="dots">•••</button></header><section class="title"><div><p class="date" id="date"></p><h1>Ritual Menu</h1></div><div class="ring" id="ring"><span id="pct">0%</span></div></section><main class="grid" id="grid"></main></div><nav class="bar"><button class="icon" id="reset">↺</button><button class="icon" id="add">＋</button></nav><aside class="overlay" id="overlay"><div class="menuTop"><button class="icon" id="close">×</button><div class="brand">RITUAL</div><small>LOCAL</small></div><div class="menuGrid"><u>Menu</u><div class="menuLinks" id="links"></div></div><div class="extra"><button id="all">All rituals</button><button id="open">Open only</button><button id="export">Export data</button></div><div class="foot"><div style="display:flex;justify-content:space-between"><span>Storage</span><span>On this iPhone　＋</span></div><div class="footLine"></div>Никаких аккаунтов, ленты и цифрового коуча, который орёт про дисциплину.</div></aside><dialog class="sheet" id="dialog"><form class="form" id="form"><div class="handle"></div><div class="sheetHead"><button type="button" id="cancel">Cancel</button><span id="sheetTitle">New ritual</span><button type="submit" style="font-weight:650" id="save">Add</button></div><label class="field"><span>Что сделать</span><input id="title" maxlength="80" placeholder="Например, 20 минут Java"></label><label class="field"><span>Раздел меню</span><select id="category"></select></label><input type="hidden" id="edit"></form></dialog><script>const K='ritual-menu.v1',cats=[['starters','Starters'],['mains','Mains'],['sides','Sides'],['desserts','Desserts'],['specials','Specials']],seed=[['starters','Выпить стакан воды'],['starters','Открыть шторы'],['starters','Пять спокойных вдохов'],['mains','20 минут Java'],['mains','Один шаг в реальном проекте'],['mains','Прогулка без телефона'],['sides','Послушать один альбом'],['sides','Записать одну идею'],['desserts','Посмотреть что-то красивое'],['desserts','Съесть тёмный шоколад'],['desserts','Поиграть музыку без цели'],['specials','Купить вещь из wishlist'],['specials','Спланировать маленькую поездку']].map((x,i)=>({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+i,category:x[0],title:x[1],done:false,created:Date.now()+i}));let s=(()=>{try{return JSON.parse(localStorage.getItem(K))||{items:seed}}catch{return{items:seed}}})(),filter='all';const q=x=>document.querySelector(x),grid=q('#grid'),dlg=q('#dialog'),title=q('#title'),cat=q('#category'),edit=q('#edit'),overlay=q('#overlay');q('#date').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());cat.innerHTML=cats.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('');q('#links').innerHTML=cats.map(c=>`<button data-c="${c[0]}">${c[1]}</button>`).join('');function save(){localStorage.setItem(K,JSON.stringify(s))}function render(){grid.innerHTML='';let vis=filter==='open'?s.items.filter(x=>!x.done):s.items;cats.forEach(c=>{let items=vis.filter(x=>x.category===c[0]).sort((a,b)=>a.created-b.created),a=document.createElement('article');a.className='card';a.dataset.c=c[0];a.innerHTML=`<button class="cardHead"><strong>${c[1]}</strong><span class="count">${items.length}</span><span class="chev">›</span></button><ul class="list"></ul><button class="addSmall">+ add</button>`;let ul=a.querySelector('ul');items.forEach(x=>{let li=document.createElement('li');li.className='row'+(x.done?' done':'');li.innerHTML=`<button class="check"></button><button class="text"></button><button class="del">×</button>`;li.querySelector('.text').textContent=x.title;li.querySelector('.check').onclick=()=>{x.done=!x.done;save();render()};li.querySelector('.text').onclick=()=>openDlg(x);li.querySelector('.del').onclick=()=>{if(confirm('Удалить «'+x.title+'»?')){s.items=s.items.filter(i=>i.id!==x.id);save();render()}};ul.append(li)});a.querySelector('.addSmall').onclick=()=>openDlg(null,c[0]);grid.append(a)});let d=s.items.filter(x=>x.done).length,p=s.items.length?Math.round(d/s.items.length*100):0;q('#ring').style.setProperty('--a',p*3.6+'deg');q('#pct').textContent=p+'%'}function openDlg(x,c='starters'){q('#sheetTitle').textContent=x?'Edit ritual':'New ritual';q('#save').textContent=x?'Save':'Add';title.value=x?.title||'';cat.value=x?.category||c;edit.value=x?.id||'';dlg.showModal();setTimeout(()=>title.focus(),100)}q('#form').onsubmit=e=>{e.preventDefault();let v=title.value.trim();if(!v)return;let x=s.items.find(i=>i.id===edit.value);if(x){x.title=v;x.category=cat.value}else s.items.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'',title:v,category:cat.value,done:false,created:Date.now()});save();dlg.close();render()};q('#cancel').onclick=()=>dlg.close();function om(){overlay.classList.add('open')}q('#menu').onclick=om;q('#dots').onclick=om;q('#close').onclick=()=>overlay.classList.remove('open');q('#add').onclick=()=>openDlg();q('#reset').onclick=()=>{if(confirm('Сбросить все отметки?')){s.items.forEach(x=>x.done=false);save();render()}};q('#all').onclick=()=>{filter='all';overlay.classList.remove('open');render()};q('#open').onclick=()=>{filter='open';overlay.classList.remove('open');render()};q('#links').onclick=e=>{let b=e.target.closest('[data-c]');if(!b)return;overlay.classList.remove('open');setTimeout(()=>q(`[data-c="${b.dataset.c}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),100)};q('#export').onclick=()=>{let b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='ritual-menu.json';a.click();URL.revokeObjectURL(u)};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
